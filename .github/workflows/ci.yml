name: build-and-test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore

    - name: Show Infrastructure Data files (debug)
      run: |
        echo "Listing src/NetAdmin.Infrastructure/Data";
        ls -la src/NetAdmin.Infrastructure/Data || true;
        echo "--- AppDbContext.cs head ---";
        sed -n '1,80p' src/NetAdmin.Infrastructure/Data/AppDbContext.cs || true;


    - name: Run diagnostic build for Infrastructure (diagnose namespace issues)
      run: dotnet build src/NetAdmin.Infrastructure/NetAdmin.Infrastructure.csproj -v diag || true

    - name: Install dotnet-format
      run: |
        dotnet tool install --tool-path ./tools dotnet-format

    - name: Run dotnet-format (check)
      run: ./tools/dotnet-format --verify-no-changes --folder || true

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration Release
